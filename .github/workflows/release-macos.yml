# Build & Release (macOS) — auto-syncs upstream and publishes a macOS-only release.
#
# Triggers:
#   - push a tag (v*): build + publish that tag.
#   - schedule (weekly, Mondays 06:00 UTC): check github.com/tone-3000/tone3000-plugin;
#     if it moved, merge it into main, tag the result, and publish a release.
#     Fully unattended: on a merge conflict it skips the release (the previous one
#     stays as-is) and opens an issue; a human resolves it whenever convenient.
#   - manual (workflow_dispatch): same as schedule.
#
# This fork's only change is hosted macOS AU/VST3 effects, so releases are macOS-only.
# If an upstream merge conflicts (they touched a file we changed), the sync job fails
# and opens an issue — a human resolves it, then re-runs or pushes a tag.

name: Build & Release (macOS)

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 6 * * 1'   # weekly — Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream main
        id: check
        run: |
          set -euo pipefail
          git config user.name "tone3000-fork-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/tone-3000/tone3000-plugin.git
          git fetch --no-tags upstream main
          UP=$(git rev-parse upstream/main)
          LAST=$(tr -d '[:space:]' < .github/upstream-sha 2>/dev/null || true)
          echo "upstream=$UP  last=$LAST"
          if [ "$UP" = "$LAST" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged — nothing to release."
            exit 0
          fi
          VER=$(git show upstream/main:VERSION | tr -d '[:space:]')
          TAG="v${VER}-hosted.${UP:0:7}"
          if ! git merge --no-edit "$UP"; then
            git merge --abort || true
            echo "::error::Upstream merge conflicts with the hosted-effects changes — a human must resolve."
            exit 1
          fi
          echo "$UP" > .github/upstream-sha
          git add .github/upstream-sha
          git commit -m "chore: sync upstream ${UP:0:7} (${VER})"
          git push origin HEAD:main
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "New release tag: $TAG"

      - name: Open an issue if the sync failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Upstream sync failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled sync could not merge github.com/tone-3000/tone3000-plugin — most likely a conflict with this fork's hosted-effects changes. Resolve manually, then re-run the workflow or push a tag. Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  build:
    needs: [sync]
    if: always() && (github.event_name == 'push' || (needs.sync.result == 'success' && needs.sync.outputs.new == 'true'))
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read version
        run: echo "T3K_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Install toolchain
        run: brew install ninja cmake

      # Public builds ship WITHOUT a baked key: every user pastes their own
      # free publishable key (tone3000.com/settings) into Plugin Settings, and
      # all catalog traffic runs under that key. No secret, no fallback — never
      # bake anyone's client_id (not even the maintainer's) into binaries.
      - name: Write empty build key (.env)
        run: |
          printf 'T3K_PUBLISHABLE_KEY=\n' > .env

      - name: Configure (JUCE fetched by CPM)
        # T3K_FORK_NAMESPACED=ON ships the fork identities (TONE3000-FX,
        # T3KX/ZYUS, own LV2/CLAP/data-dir) so these binaries coexist with
        # official TONE3000 installs instead of colliding with them.
        # See cmake/ForkIdentity.cmake.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DT3K_FORK_NAMESPACED=ON

      - name: Apply JUCE popup-submenu fix (macOS)
        run: sh script/patch_juce_popupmenu.sh

      - name: Build Standalone + AU + VST3
        run: cmake --build build -j3 --target TONE3000_Standalone TONE3000_AU TONE3000_VST3

      - name: Package
        run: |
          set -euo pipefail
          REL="build/plugin/TONE3000_artefacts/Release"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$REL/Standalone/TONE3000-FX.app" \
            "dist/TONE3000-FX-${T3K_VERSION}-macOS-arm64-Standalone.zip"
          cp -R "$REL/AU/TONE3000-FX.component" dist/
          cp -R "$REL/VST3/TONE3000-FX.vst3" dist/
          ( cd dist && zip -ry "TONE3000-FX-${T3K_VERSION}-macOS-arm64-AU-VST3.zip" \
              TONE3000-FX.component TONE3000-FX.vst3 >/dev/null )
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-FX-${{ env.T3K_VERSION }}-macOS-arm64
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'push' || needs.sync.outputs.new == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || needs.sync.outputs.tag }}
          name: "TONE3000 + Hosted AU/VST3 Effects ${{ github.event_name == 'push' && github.ref_name || needs.sync.outputs.tag }} — macOS only"
          body: |
            **macOS only** (Apple Silicon, arm64).

            Community fork of [tone3000-plugin](https://github.com/tone-3000/tone3000-plugin) —
            **all credit for the base app goes to the TONE3000 team**
            ([tone3000.com](https://www.tone3000.com)). Powered by TONE3000: the tone catalog,
            accounts and downloads are TONE3000 services used under their API Terms.
            This fork adds **hosted macOS AU/VST3
            effects** in the chain (an Effect block + an in-plugin vendor browser).

            **Downloads**
            - `TONE3000-FX-*-macOS-arm64-Standalone.zip` — the standalone app. Unzip and open
              (right-click → Open the first time: it is ad-hoc signed, not notarized).
            - `TONE3000-FX-*-macOS-arm64-AU-VST3.zip` — the AU + VST3 plugin. Copy
              `TONE3000-FX.component` to `~/Library/Audio/Plug-Ins/Components/` and
              `TONE3000-FX.vst3` to `~/Library/Audio/Plug-Ins/VST3/`, then rescan in your DAW.

            **Coexistence:** these binaries ship under fork identities (`TONE3000 FX`,
            AU `T3KX`/`ZYUS`, own LV2/CLAP IDs and app-data folder), so they install
            and scan alongside official TONE3000 releases. If you still have the
            older same-named fork builds (`TONE3000.component` / `TONE3000.vst3` from
            earlier releases), delete them to avoid two entries for the same slot.

            **First run — your own API key:** these builds ship without a key. Open Plugin
            Settings → **TONE3000 API key**, paste your free publishable key from
            [tone3000.com/settings](https://www.tone3000.com/settings) (sign in first),
            reopen the window, then sign in. Catalog traffic runs under your key.

            **How to load an effect:** right-click an empty `+` slot in the chain →
            **Add AU/VST3 Effect** → pick a vendor → pick the effect → click the tile to open its
            editor. See the README for the full instructions.

            Not affiliated with or endorsed by TONE3000. MIT (see LICENSE).
          files: dist/*.zip
          fail_on_unmatched_files: true
